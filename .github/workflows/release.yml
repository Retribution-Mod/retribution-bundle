name: Release
on:
    workflow_dispatch:
        inputs:
            version:
                description: "Bundle version (e.g. 0.0.1.1)"
                required: true
                type: string

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Restore Bun cache
              uses: actions/cache@v4
              with:
                path: ~/.bun/install/cache
                key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                restore-keys: |
                    ${{ runner.os }}-bun-

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build old bundle
              run: bun run build --build-minify --target old
              env:
                BUNDLE_VERSION: "v${{ github.event.inputs.version }}-old"

            - name: Build new bundle
              run: bun run build --build-minify --target new
              env:
                BUNDLE_VERSION: "v${{ github.event.inputs.version }}-new"

            - name: Create legacy compatibility asset
              run: cp dist/retribution-old.min.js dist/retribution.min.js

            - name: Create GitHub release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                tag_name: v${{ github.event.inputs.version }}
                name: Retribution v${{ github.event.inputs.version }}
                files: |
                    dist/retribution-old.min.js
                    dist/retribution-new.min.js
                    dist/retribution.min.js
                generate_release_notes: true
